<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <title>Golf Camera Lines</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" aria-label="Camera with alignment lines">
      <div class="stage" id="stage">
        <video
          id="video"
          class="video"
          playsinline
          autoplay
          muted
        ></video>
        <canvas id="overlay" class="overlay" aria-label="Line overlay"></canvas>

        <div class="hud top">
          <div class="brand">Golf Camera Lines</div>
          <div class="status" id="status" role="status" aria-live="polite"></div>
        </div>

        <div class="hud bottom">
          <button id="btnStartStop" class="btn primary" type="button">Start camera</button>
          <div class="seg" role="group" aria-label="View mode">
            <button id="btnViewFront" class="segBtn active" type="button">Front</button>
            <button id="btnViewSide" class="segBtn" type="button">Side</button>
          </div>
          <button id="btnAdd" class="btn" type="button" disabled>Add line</button>
          <button id="btnDelete" class="btn danger" type="button" disabled>Delete</button>
          <button id="btnReset" class="btn" type="button" disabled>Reset</button>
          <select id="fps" class="select" disabled aria-label="Recording FPS">
            <option value="30">30 fps</option>
            <option value="60">60 fps</option>
          </select>
          <button id="btnRecord" class="btn" type="button" disabled>Record</button>
          <button id="btnStopRec" class="btn danger" type="button" disabled>Stop</button>
        </div>

        <div class="countdown" id="countdown" aria-hidden="true"></div>

        <div class="help" id="help">
          <div class="helpCard">
            <div class="helpTitle">Tips</div>
            <ul class="helpList">
              <li>Install as a web app: Share → Add to Home Screen.</li>
              <li>Tap a line to select it.</li>
              <li>Drag an endpoint to rotate/resize.</li>
              <li>Drag the line body to move it.</li>
              <li>Controls hide after a moment; tap to show them again.</li>
            </ul>
            <button id="btnDismissHelp" class="btn small" type="button">Got it</button>
          </div>
        </div>
      </div>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
