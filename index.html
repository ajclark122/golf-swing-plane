<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f19" />
    <title>Simple Golf Alignment App</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app" aria-label="Camera with alignment lines">
      <div class="stage" id="stage">
        <div class="vignette" aria-hidden="true"></div>
        <video
          id="video"
          class="video"
          playsinline
          autoplay
          muted
        ></video>
        <canvas id="overlay" class="overlay" aria-label="Line overlay"></canvas>

        <div class="hud top">
          <div class="brand">
            <div class="brandMark" aria-hidden="true"></div>
            <div class="brandText">
              <div class="brandTitle">Simple Golf Alignment App</div>
              <div class="brandSub">Live camera overlay</div>
            </div>
          </div>
          <div class="status" id="status" role="status" aria-live="polite">Tap Start camera</div>
        </div>

        <div class="hud bottom">
          <div class="dock">
            <div class="group row1">
              <button id="btnStartStop" class="btn primary" type="button">
                <span class="btnIcon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M8 5v14l11-7-11-7Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
                  </svg>
                </span>
                <span class="btnLabel">Start camera</span>
              </button>
              <div class="seg" role="group" aria-label="View mode">
                <button id="btnViewFront" class="segBtn active" type="button">Front</button>
                <button id="btnViewSide" class="segBtn" type="button">Side</button>
              </div>
            </div>

            <div class="group row2">
              <button id="btnAdd" class="btn iconOnly" type="button" disabled aria-label="Add line">
                <span class="btnIcon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </span>
                <span class="srOnly">Add</span>
              </button>
              <button id="btnDelete" class="btn danger iconOnly" type="button" disabled aria-label="Delete selected line">
                <span class="btnIcon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M6 7h12M9 7v-2h6v2M9 10v8M12 10v8M15 10v8M7 7l1 14h8l1-14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  </svg>
                </span>
                <span class="srOnly">Delete</span>
              </button>
              <button id="btnReset" class="btn iconOnly" type="button" disabled aria-label="Reset lines">
                <span class="btnIcon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    <path d="M20 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </span>
                <span class="srOnly">Reset</span>
              </button>
            </div>

            <div class="group row3">
              <select id="fps" class="select" disabled aria-label="Recording FPS">
                <option value="30">30 fps</option>
                <option value="60">60 fps</option>
              </select>
              <button id="btnRecord" class="btn accent iconOnly" type="button" disabled aria-label="Record">
                <span class="btnIcon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="6.2" fill="currentColor" opacity="0.95"/>
                  </svg>
                </span>
                <span class="srOnly">Record</span>
              </button>
              <button id="btnStopRec" class="btn danger iconOnly" type="button" disabled aria-label="Stop recording">
                <span class="btnIcon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none">
                    <path d="M8 8h8v8H8z" fill="currentColor" opacity="0.92"/>
                  </svg>
                </span>
                <span class="srOnly">Stop</span>
              </button>
            </div>
          </div>
        </div>

        <button id="btnStopFloat" class="stopFloat" type="button" aria-label="Stop recording">
          Stop
        </button>

        <div class="countdown" id="countdown" aria-hidden="true"></div>

        <div class="help" id="help">
          <div class="helpCard">
            <div class="helpTitle">Tips</div>
            <ul class="helpList">
              <li>Install as a web app: Share → Add to Home Screen.</li>
              <li>Tap a line to select it.</li>
              <li>Drag an endpoint to rotate/resize.</li>
              <li>Drag the line body to move it.</li>
              <li>Controls hide after a moment; tap to show them again.</li>
            </ul>
            <button id="btnDismissHelp" class="btn small" type="button">Got it</button>
          </div>
        </div>
      </div>
    </main>

    <script src="./app.js" defer></script>
  </body>
</html>
